<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>ZxManager</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #080808;
        color: #fafafa;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080808;
      }

      body {
        display: grid;
        place-items: center;
        user-select: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }

      img {
        width: 104px;
        height: 104px;
        object-fit: contain;
        pointer-events: none;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgb(250 250 250 / 20%);
        border-top-color: rgb(250 250 250 / 72%);
        border-radius: 9999px;
        animation: spin 800ms linear infinite;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
          border-color: rgb(250 250 250 / 28%);
          border-top-color: rgb(250 250 250 / 72%);
        }
      }
    </style>
  </head>
  <body>
    <main aria-busy="true" aria-label="ZxManager 正在启动">
      <img
        src="/icon-128.png"
        alt=""
        width="128"
        height="128"
        draggable="false"
      />
      <h1>ZxManager</h1>
      <div class="spinner" role="status">
        <span class="sr-only">正在启动</span>
      </div>
    </main>
  </body>
</html>
