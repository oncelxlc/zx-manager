<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved workbench theme before styles load and the desktop window restores.
      (() => {
        let theme;
        try {
          theme = JSON.parse(localStorage.getItem("zx-once.workbench.preferences.v1"))?.theme;
        } catch { /* Unavailable storage uses the system preference. */ }
        const systemDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
        const dark = theme === "dark" || (theme !== "light" && systemDark);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zx-once</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
